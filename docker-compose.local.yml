version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gramfund
      POSTGRES_PASSWORD: gramfund
      POSTGRES_DB: gramfund
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gramfund -d gramfund"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
