name: CI

on:
  pull_request:
  push:
    branches: [ main, master, work ]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gramfund
          POSTGRES_PASSWORD: gramfund
          POSTGRES_DB: gramfund
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U gramfund -d gramfund"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://gramfund:gramfund@localhost:5432/gramfund
      REDIS_URL: redis://localhost:6379
      PORT: 3000
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm run check
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - run: npm run test
      - run: npm run build
